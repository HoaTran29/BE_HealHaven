# JWT Configuration
jwt:
  secret: ${JWT_SECRET:healhaven-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Server Configuration
server:
  port: 8080
  servlet:
     context-path: /api

# Logging
logging:
  level:
    backend.healhaven: DEBUG
    org.springframework.security: DEBUG

