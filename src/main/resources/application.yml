spring:
  application:
    name: healhaven

  # Database Configuration (Supabase PostgreSQL)
  datasource:
    # Using Supavisor Connection Pooling (Transaction Mode port 6543)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.rtahmkkunlwacxdyrnrx}
    password: ${SPRING_DATASOURCE_PASSWORD:geXHyn6YfpOadJPe}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1089431720402-svcom6u19il9djr08s81qj1i66oj01et.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/google}"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:healhaven-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
     context-path: /api

# Logging
logging:
  level:
    backend.healhaven: DEBUG
    org.springframework.security: DEBUG

# VNPay Configuration (Sandbox)
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:V0HLB31O}
  hash-secret: ${VNPAY_HASH_SECRET:72UB14VN1ILYFFVXS90NPRQMOVCKK4CZ}
  url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  # IPN URL: VNPay gọi server-to-server để xác nhận giao dịch
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay-ipn}
  # Return URL: trình duyệt redirect về sau khi thanh toán
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
  version: "2.1.0"
  command: "pay"
