    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.rtahmkkunlwacxdyrnrx
    password: geXHyn6YfpOadJPe
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 1089431720402-svcom6u19il9djr08s81qj1i66oj01et.apps.googleusercontent.com
            client-secret: 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
